[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-revert"
version = "0.2.0"
description = "Undo any AI coding agent in one command — snapshot / revert / timeline / diff for your working tree"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kaia-cod" }]
keywords = ["ai-agents", "undo", "rollback", "snapshot", "cli", "devtools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/kaia-cod/agent-revert"
Repository = "https://github.com/kaia-cod/agent-revert"
Issues = "https://github.com/kaia-cod/agent-revert/issues"

[project.scripts]
agent-revert = "agent_revert.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agent_revert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
